jtex: v1
title: Book Template
description: Professional textbook template
version: 0.1.0
license: MIT
authors:
  - name: David M. Straub
kind: typst
template: template.typ
files:
  - template.typ
  - cc-by.svg
  - table-style.typ
  - cover.png
  - cover-logo.svg
  - title-page-logo.svg

doc:
  - id: title
    required: true
  - id: authors
    required: true
  - id: doi

options:
  - id: book_title
    type: string
    required: true
    description: Book title (title page and running header)
  - id: book_subtitle
    type: string
    default: ""
    description: Book subtitle
  - id: cover_image
    type: string
    default: "cover.png"
    description: >
      Filename of the cover image (must be listed under `files` in
      template.yml so jtex copies it alongside template.typ), shown at
      full width and uncropped below the title. Leave empty ("") to
      render a plain colour cover with no image.
  - id: cover_bg_color
    type: string
    default: "#2f4e6e"
    description: Cover page background colour (fills the whole page)
  - id: cover_logo
    type: string
    default: "cover-logo.svg"
    description: >
      Filename of the publisher logo (must be listed under `files` in
      template.yml so jtex copies it alongside template.typ), shown in a
      footer band below the cover image on the cover page. Use a
      light/white variant since it sits on the dark cover background.
      Leave empty ("") to omit it.
  - id: title_page_logo
    type: string
    default: "title-page-logo.svg"
    description: >
      Filename of the publisher logo (must be listed under `files` in
      template.yml so jtex copies it alongside template.typ), shown at
      the bottom of the title page. Use a dark/black variant since it
      sits on the white title page background. Leave empty ("") to
      omit it.
  - id: cover_text_color
    type: string
    default: "#ffffff"
    description: Title/subtitle/author text colour on the cover page
  - id: paper
    type: choice
    default: a4
    choices: [a4, us-letter]
    description: Paper size
  - id: accent_color
    type: string
    default: "#4a6fa5"
    description: Accent colour as a CSS hex string (e.g. "#4a6fa5")
  - id: font_size
    type: string
    default: 11pt
    description: Body font size (e.g. 11pt, 12pt)
  - id: edition
    type: string
    default: ""
    description: Edition label (e.g. "First Edition", "Draft")
  - id: year
    type: string
    default: ""
    description: Publication year
  - id: publisher
    type: string
    default: ""
    description: Publisher name
  - id: isbn
    type: string
    default: ""
    description: ISBN
  - id: urn
    type: string
    default: ""
    description: URN (e.g. urn:isbn:...)
  - id: bibliography_file
    type: file
    description: >
      BibTeX file Typst reads directly for the References section. MyST
      regenerates its own copy of the project bibliography and drops
      brace-protected casing ({scikit-fem}, {de Boor}) in the process;
      pointing Typst at the original keeps it.
  - id: bibliography_style
    type: string
    default: ieee
    description: >
      Typst citation style for the References section (e.g.
      chicago-author-date, apa, ieee)
  - id: book_license
    type: string
    default: >
      This work is licensed under a Creative Commons Attribution 4.0
      International License. To view a copy of this license, visit
      https://creativecommons.org/licenses/by/4.0/.
    description: License statement
